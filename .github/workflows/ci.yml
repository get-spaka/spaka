# Every push to main, every pull request, and a run asked for (by ci-box.yml
# or by hand in the Actions tab). On Linux, always: lint, types and the unit
# tests, the quick answer. On macOS (Apple silicon) and Windows, the two
# systems Spaka is published for, whose runners cost the most: only on main,
# on a run asked for, or for a pull request whose description has its box
# ticked (.github/pull_request_template.md; Q447-Q449). There, the unit tests
# and the packaged app, built unsigned and checked; then the whole-app checks
# in four parallel shards, the agent replayed from a recording (no account, no
# key).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # ci-box.yml asks for one when a pull request's box is ticked once it is open.
  workflow_dispatch:
# A new run of a branch cancels its run of the same kind: a run asked for leaves
# the pull request's own run, quick on Linux, to finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
# A failing job cancels the whole run (the last step of each job), so that no
# runner keeps working once the answer is known.
permissions:
  contents: read
  actions: write
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # LF everywhere, the templates' submodule included, which the repository's .gitattributes does not reach.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Stop the whole run on a failure
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
  test:
    strategy:
      fail-fast: true
      matrix:
        # Linux always; macOS and Windows on main, on a run asked for, or with the box ticked.
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.body, '[x] Run the checks on macOS and Windows')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron fetches its program the first time it is asked for: asked by two
      # test files at once, it was written twice into one folder, and one of them
      # ran it half written. Fetched once here, before the tests.
      - name: Fetch Electron's program
        shell: bash
        run: pnpm --filter @spaka/desktop exec node -e "require('electron')"
      - run: pnpm exec vitest run --bail 1
      - name: Package the app, unsigned
        if: runner.os != 'Linux'
        run: pnpm --filter @spaka/desktop ${{ runner.os == 'Windows' && 'package:win' || 'package' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the packaged app
        if: runner.os != 'Linux'
        run: pnpm exec vitest run --config e2e/vitest.config.ts e2e/packaged.e2e.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stop the whole run on a failure
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
  e2e:
    # On macOS and Windows alone: on main, on a run asked for, or with the box ticked. Named by GitHub, as
    # "e2e (macos-latest, 1)", since a name of its own would show unexpanded when the job is skipped.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.body, '[x] Run the checks on macOS and Windows')
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the app
        run: pnpm --filter @spaka/desktop build && pnpm background-electron
      # A Windows runner's screen is 1024×768, smaller than the app's window: Windows shrinks the window to it.
      - name: Give the Windows screen a computer's size
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
      - name: Check the whole app, shard ${{ matrix.shard }} of 4
        run: pnpm exec vitest run --config e2e/vitest.config.ts --exclude "**/packaged.e2e.ts" --shard ${{ matrix.shard }}/4 --bail 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Keep the checks' pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.shard }}
          path: e2e/.runs/*.png
          if-no-files-found: ignore
      - name: Stop the whole run on a failure
        if: failure()
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
