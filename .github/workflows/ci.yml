# Every push to main and every pull request: the checks on macOS (Apple
# silicon) and on Windows, the two systems Upstart is published for. The
# packaged app is built unsigned and checked whole, its agent replayed from a
# recording: no account, no key.
name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Package the app, unsigned
        run: pnpm --filter @upstart/desktop ${{ runner.os == 'Windows' && 'package:win' || 'package' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the whole app
        run: pnpm e2e
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Keep the checks' pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e/.runs/*.png
          if-no-files-found: ignore
