# Git hooks, installed by `pnpm install` (Lefthook): before each commit, the
# lint the CI runs; before each push, the types, the unit tests and the
# whole-app checks the pushed change calls for (Q446). `git commit --no-verify`
# and `git push --no-verify` skip them once.
# Only what the commands print and what fails.
output:
  - execution_out
  - failure
pre-commit:
  commands:
    # Biome's fixes on the staged files, staged again; what it cannot fix stops the commit.
    biome:
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    # A commit that moves the templates' submodule: the templates it points to pass their own lint.
    templates:
      glob: "apps/desktop/templates"
      root: "apps/desktop/templates/"
      run: ../../../node_modules/.bin/biome check --diagnostic-level=error .
# The types, the unit tests, then the whole-app checks named after what the
# push changes, the app built first (scripts/pre-push.ts, e2e/changed.ts).
pre-push:
  commands:
    checks:
      run: node scripts/pre-push.ts
      # Git's lines on what the push sends of each branch, from which the change is read.
      use_stdin: true
# After a checkout or a pull, the templates' submodule gets its own hooks once it is there.
post-checkout:
  commands:
    templates-hooks:
      run: node scripts/hooks.mjs
post-merge:
  commands:
    templates-hooks:
      run: node scripts/hooks.mjs
